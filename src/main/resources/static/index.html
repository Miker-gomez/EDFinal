<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Hub</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <div class="container py-4">

    <header class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
      <h1 class="h2 mb-0">Student Hub</h1>
      <div class="d-flex gap-2">
        <button id="btnDeshacer" type="button" class="btn btn-outline-secondary">Deshacer</button>
        <button id="btnVencidas" type="button" class="btn btn-outline-danger">Marcar vencidas</button>
      </div>
    </header>

    <div id="alertas" aria-live="polite"></div>

    <section id="widgetCritica" class="card border-primary mb-4">
      <div class="card-header bg-primary text-white">Próxima Entrega Crítica</div>
      <div id="criticaContenido" class="card-body">Cargando...</div>
    </section>

    <div class="row g-4 mb-4">

      <section class="col-lg-5">
        <div class="card h-100">
          <div class="card-header">Registrar tarea</div>
          <div class="card-body">
            <form id="formTarea" novalidate>
              <div class="mb-3">
                <label for="tareaTitulo" class="form-label">Título</label>
                <input id="tareaTitulo" type="text" class="form-control" maxlength="150">
              </div>
              <div class="mb-3">
                <label for="tareaMateria" class="form-label">Materia</label>
                <select id="tareaMateria" class="form-select"></select>
              </div>
              <div class="mb-3">
                <label for="tareaPrioridad" class="form-label">Prioridad (1 a 5)</label>
                <input id="tareaPrioridad" type="number" class="form-control" min="1" max="5" value="3">
              </div>
              <div class="mb-3">
                <label for="tareaFecha" class="form-label">Fecha límite</label>
                <input id="tareaFecha" type="datetime-local" class="form-control">
              </div>
              <button type="submit" class="btn btn-primary">Registrar</button>
            </form>
          </div>
        </div>
      </section>

      <section class="col-lg-7">
        <div class="card h-100">
          <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span>Tareas activas</span>
            <form id="formBuscar" class="d-flex gap-2" novalidate>
              <input id="buscarId" type="text" class="form-control form-control-sm" placeholder="Buscar por ID">
              <button type="submit" class="btn btn-sm btn-outline-primary">Buscar</button>
            </form>
          </div>
          <div class="card-body">
            <div id="resultadoBusqueda" class="mb-3"></div>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>Título</th>
                    <th>Materia</th>
                    <th>Prioridad</th>
                    <th>Fecha límite</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="listaTareas"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

    </div>

    <div class="row g-4 mb-4">

      <section class="col-lg-6">
        <div class="card h-100">
          <div class="card-header">Materias</div>
          <div class="card-body">
            <form id="formMateria" class="row g-2 mb-3" novalidate>
              <input id="materiaId" type="hidden">
              <div class="col-sm-5">
                <input id="materiaNombre" type="text" class="form-control" placeholder="Nombre">
              </div>
              <div class="col-sm-4">
                <select id="materiaProfesor" class="form-select"></select>
              </div>
              <div class="col-sm-3 d-flex gap-1">
                <button id="btnGuardarMateria" type="submit" class="btn btn-primary flex-fill">Crear</button>
                <button id="btnCancelarMateria" type="button" class="btn btn-outline-secondary d-none">X</button>
              </div>
            </form>
            <ul id="listaMaterias" class="list-group"></ul>
          </div>
        </div>
      </section>

      <section class="col-lg-6">
        <div class="card h-100">
          <div class="card-header">Profesores</div>
          <div class="card-body">
            <form id="formProfesor" class="row g-2 mb-3" novalidate>
              <div class="col-sm-5">
                <input id="profesorNombre" type="text" class="form-control" placeholder="Nombre">
              </div>
              <div class="col-sm-4">
                <input id="profesorCorreo" type="email" class="form-control" placeholder="Correo">
              </div>
              <div class="col-sm-3">
                <button type="submit" class="btn btn-primary w-100">Registrar</button>
              </div>
            </form>
            <ul id="listaProfesores" class="list-group"></ul>
          </div>
        </div>
      </section>

    </div>

    <section class="card mb-4">
      <div class="card-header">Estadísticas de entrega por materia</div>
      <div class="card-body table-responsive">
        <table class="table table-sm mb-0">
          <thead>
            <tr>
              <th>Materia</th>
              <th>Total</th>
              <th>Pendientes</th>
              <th>Completadas</th>
              <th>Vencidas</th>
            </tr>
          </thead>
          <tbody id="listaEstadisticas"></tbody>
        </table>
      </div>
    </section>

  </div>

  <div id="modalEditar" class="modal fade" tabindex="-1" aria-labelledby="modalEditarTitulo" aria-hidden="true">
    <div class="modal-dialog">
      <form id="formEditar" class="modal-content" novalidate>
        <div class="modal-header">
          <h2 id="modalEditarTitulo" class="modal-title fs-5">Editar tarea</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input id="editarId" type="hidden">
          <input id="editarFechaOriginal" type="hidden">
          <div class="mb-3">
            <label for="editarTitulo" class="form-label">Título</label>
            <input id="editarTitulo" type="text" class="form-control" maxlength="150">
          </div>
          <div class="mb-3">
            <label for="editarMateria" class="form-label">Materia</label>
            <select id="editarMateria" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label for="editarPrioridad" class="form-label">Prioridad (1 a 5)</label>
            <input id="editarPrioridad" type="number" class="form-control" min="1" max="5">
          </div>
          <div class="mb-3">
            <label for="editarFecha" class="form-label">Fecha límite</label>
            <input id="editarFecha" type="datetime-local" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
