spring.application.name=edfinal

# PostgreSQL. Los valores salen de variables de entorno (Compose las inyecta en el contenedor;
# en desarrollo local se cargan desde .env, ver 5.3). Sin default para usuario/clave a propósito.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:student_hub}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# El esquema lo crea PostgreSQL con db/init/; Spring no ejecuta SQL al arrancar.
spring.sql.init.mode=never

logging.level.com.edfinal=INFO

# Entrada JSON estricta: sin zona en las fechas, sin coerción de tipos y sin campos desconocidos
spring.jackson.default-leniency=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
